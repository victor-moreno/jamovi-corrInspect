---
name: corrInspect
title: Correlation Inspector
menuGroup: Regression
menuSubgroup: Correlation
menuTitle: Correlation Inspector
menuSubtitle: Pairwise & one-vs-rest correlations

version: '1.0.0'
jas: '1.2'

weightsSupport: 'none'

description:
    main: >
        Correlations between two or more variables, presented pair by pair
        instead of as a matrix. With exactly two variables this is a single
        clean result. With more, choose between comparing all variables
        against all others, or one reference variable against the rest --
        useful for inspecting candidate predictors or confounders before a
        regression.
    R:
        dontrun: false
        usage: |
            corrInspect::corrInspect(data = mtcars, vars = c('mpg', 'hp', 'wt'))

options:
    - name: data
      type: Data
      description:
          R: the data as a data frame

    - name: vars
      title: Variables
      type: Variables
      suggested: [ continuous ]
      permitted: [ numeric ]
      default: ~
      description:
          ui: >
              the variables to correlate. With 'Reference variable' empty,
              every variable here is compared against every other. With a
              reference variable set, these are compared against it instead
              (minus the reference variable itself, if it's also selected
              here).
          R: a vector of strings naming the variables to correlate in `data`

    - name: refVar
      title: Reference variable
      type: Variable
      suggested: [ continuous ]
      permitted: [ numeric ]
      default: ~
      description:
          ui: >
              optional. When set, switches from 'all variables vs. all' to
              'one variable vs. the rest': this variable is compared against
              each of the Variables instead of them being compared pairwise.
          R: >
              a string naming the reference variable in `data`, or `NULL`
              (default) for all-vs-all correlations among `vars`

    - name: refAxis
      title: Reference variable axis
      type: List
      options:
        - name: x
          title: X
        - name: y
          title: 'Y'
      default: x
      description:
          ui: which axis holds the reference variable in the inspector scatterplots.
          R: '`''x''` (default) or `''y''`, which axis the reference variable is plotted on'

    - name: pearson
      title: Pearson
      type: Bool
      default: true
      description:
          R: '`TRUE` (default) or `FALSE`, provide Pearson''s r'

    - name: spearman
      title: Spearman
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), provide Spearman''s rho'

    - name: kendall
      title: Kendall's tau-b
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), provide Kendall''s tau-b'

    - name: hypothesis
      title: Hypothesis
      type: List
      options:
        - name: corr
          title: Correlated
        - name: pos
          title: Correlated positively
        - name: neg
          title: Correlated negatively
      default: corr
      description:
          ui: the alternative hypothesis. Allows for one-tailed tests.
          R: >
              one of `'corr'` (default), `'pos'`, `'neg'` specifying the
              alternative hypothesis; correlated, correlated positively,
              correlated negatively respectively

    - name: sig
      title: Report p-value
      type: Bool
      default: true
      description:
          ui: shown in the table, and (with Scatterplots on) in each scatterplot's annotation.
          R: '`TRUE` (default) or `FALSE`, provide a p-value for each correlation'

    - name: flag
      title: Flag significant correlations
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), flag significant correlations (p < .05) with an asterisk'

    - name: n
      title: 'N'
      type: Bool
      default: false
      description:
          R: '`TRUE` or `FALSE` (default), provide the number of cases'

    - name: ci
      title: Confidence interval
      type: Bool
      default: false
      description:
          ui: >
              shown in the table, and (with Scatterplots on) as a value in
              each scatterplot's annotation. See 'Confidence band' below to
              also draw it on the plot.
          R: '`TRUE` or `FALSE` (default), provide a confidence interval for each correlation coefficient'

    - name: ciWidth
      title: Confidence interval width
      type: Number
      min: 50
      max: 99.9
      default: 95
      description:
          R: a number between 50 and 99.9 (default 95), the confidence interval width

    - name: plots
      title: Scatterplots
      type: Bool
      default: false
      description:
          ui: >
              with two Variables, or a reference variable, an annotated
              scatterplot (or one per comparison, with a reference
              variable). With more than two Variables and no reference
              variable, either a matrix or one scatterplot per pair --
              see Layout below.
          R: '`TRUE` or `FALSE` (default), provide annotated scatterplot(s)'

    - name: plotsFormat
      title: Layout
      type: List
      options:
        - name: matrix
          title: Matrix
        - name: pairs
          title: Pairs
      default: matrix
      description:
          ui: >
              with more than two Variables and no reference variable:
              'Matrix' packs every pair into small panels of one plot;
              'Pairs' gives each pair its own full-sized annotated
              scatterplot, the same as with a reference variable.
          R: >
              `'matrix'` (default) or `'pairs'`, how scatterplots are laid
              out for more than two variables with no reference variable

    - name: plotR
      title: r
      type: Bool
      default: true
      description:
          ui: show r in each scatterplot's annotation.
          R: '`TRUE` (default) or `FALSE`, show r on the scatterplot(s)'

    - name: plotLine
      title: Regression line
      type: Bool
      default: true
      description:
          ui: draw the fitted regression line.
          R: '`TRUE` (default) or `FALSE`, draw the regression line on the scatterplot(s)'

    - name: plotEquation
      title: Line equation
      type: Bool
      default: true
      description:
          ui: show the fitted line's equation in each scatterplot's annotation.
          R: '`TRUE` (default) or `FALSE`, show the regression equation on the scatterplot(s)'

    - name: plotCIBand
      title: Confidence band
      type: Bool
      default: false
      description:
          ui: >
              a blue confidence band around the regression line (needs
              'Regression line' above; separate from the table/annotation
              'Confidence interval' option).
          R: '`TRUE` or `FALSE` (default), draw a confidence band on the scatterplot(s)'

    - name: plotPredBand
      title: Prediction band
      type: Bool
      default: false
      description:
          ui: >
              a pink prediction band (for individual points) around the
              regression line (needs 'Regression line' above), in addition
              to the blue confidence band from 'Confidence band'.
          R: '`TRUE` or `FALSE` (default), draw a prediction band on the scatterplot(s)'

    - name: heatmap
      title: Correlation heatmap
      type: Bool
      default: false
      description:
          ui: >
              a colour-coded heatmap of pairwise correlations: all
              variables against all with no reference variable selected
              (needs more than two Variables), or a single column against
              the reference variable when one is set.
          R: '`TRUE` or `FALSE` (default), provide a correlation heatmap'

    - name: heatmapMethod
      title: Coefficient
      type: List
      options:
        - name: pearson
          title: Pearson
        - name: spearman
          title: Spearman
        - name: kendall
          title: Kendall's tau-b
      default: pearson
      description:
          ui: which correlation coefficient the heatmap's colours and cell values are based on.
          R: >
              `'pearson'` (default), `'spearman'`, or `'kendall'`, which
              coefficient the heatmap shows

    - name: heatmapDetails
      title: Details
      type: Bool
      default: false
      description:
          ui: >
              show each cell's 95% CI / p-value / N / significance flag as
              well as r, reusing whichever of those are already switched on
              above (Confidence interval, Report p-value, N, Flag
              significant correlations) instead of adding separate options.
          R: '`TRUE` or `FALSE` (default), add CI/p/N/flag detail to each heatmap cell'

...
