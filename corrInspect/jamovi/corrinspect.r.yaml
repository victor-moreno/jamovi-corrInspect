---
name: corrInspect
title: Correlation Inspector
jrs: '1.1'

items:
    - name: tableAllVsAll
      title: Correlations
      type: Table
      visible: false
      clearWith:
          - vars
          - refVar
          - pearson
          - spearman
          - kendall
          - hypothesis
          - ciWidth
      columns:
          - name: var1
            title: ''
            type: text
            combineBelow: true
          - name: var2
            title: ''
            type: text
            combineBelow: true
          - name: stat
            title: ''
            type: text
          - name: r
            title: r
            type: number
            format: zto
          - name: ci
            title: 95% CI
            type: text
            visible: (ci)
          - name: n
            title: 'N'
            type: integer
            visible: (n)
          - name: p
            title: p
            type: number
            format: zto,pvalue
            visible: (sig)
          - name: stars
            title: ''
            type: text
            visible: (flag)

    - name: tableRefVsRest
      title: Correlations
      type: Table
      visible: false
      clearWith:
          - refVar
          - vars
          - pearson
          - spearman
          - kendall
          - hypothesis
          - ciWidth
      columns:
          - name: var2
            title: Compared with
            type: text
            combineBelow: true
          - name: stat
            title: ''
            type: text
          - name: r
            title: r
            type: number
            format: zto
          - name: ci
            title: 95% CI
            type: text
            visible: (ci)
          - name: n
            title: 'N'
            type: integer
            visible: (n)
          - name: p
            title: p
            type: number
            format: zto,pvalue
            visible: (sig)
          - name: stars
            title: ''
            type: text
            visible: (flag)

    - name: plotAllVsAll
      title: Scatterplot
      type: Image
      visible: false
      requiresData: true
      renderFun: .plotAllVsAll
      clearWith:
          - vars
          - refVar
          - pearson
          - spearman
          - kendall
          - ci
          - ciWidth
          - plots
          - plotDens
          - heatmap

    - name: plotRefVsRest
      title: Scatterplots
      type: Array
      visible: false
      template:
          type: Image
          renderFun: .plotRefVsRest
          requiresData: true
      clearWith:
          - refVar
          - vars
          - refAxis
          - pearson
          - ci
          - ciWidth
          - plots
          - plotDens

...
