title: Correlation Inspector
name: corrInspect
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      name: variablesupplier
      suggested: [ continuous, ordinal ]
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Variables
            children:
                - type: VariablesListBox
                  name: vars
                  isTarget: true
          - type: TargetLayoutBox
            label: Reference variable
            children:
                - type: VariablesListBox
                  name: refVar
                  isTarget: true
                  maxItemCount: 1

    - type: LayoutBox
      margin: large
      style: inline
      children:
          - type: Label
            label: Reference variable axis
            children:
                - type: RadioButton
                  name: refAxis_x
                  optionName: refAxis
                  optionPart: x
                  enable: (refVar)
                - type: RadioButton
                  name: refAxis_y
                  optionName: refAxis
                  optionPart: y
                  enable: (refVar)

    - type: LayoutBox
      margin: large
      style: inline
      children:
          - type: Label
            label: Correlation Coefficients
            children:
                - type: CheckBox
                  name: pearson
                - type: CheckBox
                  name: spearman
                - type: CheckBox
                  name: kendall
          - type: Label
            label: Additional Options
            children:
                - type: CheckBox
                  name: sig
                - type: CheckBox
                  name: flag
                - type: CheckBox
                  name: 'n'
                - type: CheckBox
                  name: ci
                  children:
                      - type: TextBox
                        name: ciWidth
                        label: Interval
                        suffix: '%'
                        format: number
                        enable: (ci)

    - type: LayoutBox
      margin: large
      style: inline
      children:
          - type: Label
            label: Hypothesis
            children:
                - type: RadioButton
                  name: hypothesis_corr
                  optionName: hypothesis
                  optionPart: corr
                - type: RadioButton
                  name: hypothesis_pos
                  optionName: hypothesis
                  optionPart: pos
                - type: RadioButton
                  name: hypothesis_neg
                  optionName: hypothesis
                  optionPart: neg

    - type: LayoutBox
      margin: large
      style: inline
      children:
          - type: Label
            label: Scatterplots
            children:
                - type: CheckBox
                  name: plots
                  children:
                      - type: RadioButton
                        name: plotsFormat_matrix
                        optionName: plotsFormat
                        optionPart: matrix
                        enable: (plots)
                      - type: RadioButton
                        name: plotsFormat_pairs
                        optionName: plotsFormat
                        optionPart: pairs
                        enable: (plots)
                      - type: CheckBox
                        name: plotR
                        enable: (plots)
                      - type: CheckBox
                        name: plotLine
                        enable: (plots)
                      - type: CheckBox
                        name: plotEquation
                        enable: (plots)
                      - type: CheckBox
                        name: plotPredBand
                        enable: (plots)
          - type: Label
            label: Correlation heatmap
            children:
                - type: CheckBox
                  name: heatmap
                  children:
                      - type: RadioButton
                        name: heatmapMethod_pearson
                        optionName: heatmapMethod
                        optionPart: pearson
                        enable: (heatmap)
                      - type: RadioButton
                        name: heatmapMethod_spearman
                        optionName: heatmapMethod
                        optionPart: spearman
                        enable: (heatmap)
                      - type: RadioButton
                        name: heatmapMethod_kendall
                        optionName: heatmapMethod
                        optionPart: kendall
                        enable: (heatmap)
                      - type: CheckBox
                        name: heatmapDetails
                        label: Details
                        enable: (heatmap)
